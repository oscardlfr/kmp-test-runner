<svg viewBox="0 0 880 249" width="880" height="249" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Where a session's API cost goes</title>
  <desc>Color legend. With kmp-test (#0969da), without (#bc4c00). Cost component: cache write (#1a7f37), cache read (#1b7c83), output (#bf3989), uncached input (#8250df).</desc>
  <rect x="1" y="1" width="878" height="247" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="28.0" y="48.0" font-size="20" font-weight="600" fill="#1f2328">Where a session's API cost goes</text>
  <text x="28.0" y="75.0" font-size="13" font-weight="400" fill="#59636e">Share of the estimated cost by component, pooled over each group's sessions; the value is the median</text>
  <text x="28.0" y="92.0" font-size="13" font-weight="400" fill="#59636e">session cost. Blue: with kmp-test; orange: without.</text>
  <text x="28.0" y="127.0" font-size="13" font-weight="500" fill="#1f2328">Claude Code · claude-sonnet-5</text>
  <text x="28.0" y="143.0" font-size="11" font-weight="400" fill="#0969da">with kmp-test</text>
  <rect x="120.0" y="132.0" width="137.3" height="14.0" rx="1" fill="#1a7f37"/>
  <rect x="257.3" y="132.0" width="64.7" height="14.0" rx="1" fill="#1b7c83"/>
  <rect x="322.1" y="132.0" width="39.9" height="14.0" rx="1" fill="#bf3989"/>
  <rect x="361.9" y="132.0" width="0.1" height="14.0" rx="1" fill="#8250df"/>
  <text x="370.0" y="143.0" font-size="11" font-weight="400" fill="#1f2328">$0.112</text>
  <text x="28.0" y="161.0" font-size="11" font-weight="400" fill="#bc4c00">without</text>
  <rect x="120.0" y="150.0" width="113.6" height="14.0" rx="1" fill="#1a7f37"/>
  <rect x="233.6" y="150.0" width="80.2" height="14.0" rx="1" fill="#1b7c83"/>
  <rect x="313.8" y="150.0" width="48.2" height="14.0" rx="1" fill="#bf3989"/>
  <rect x="361.9" y="150.0" width="0.1" height="14.0" rx="1" fill="#8250df"/>
  <text x="370.0" y="161.0" font-size="11" font-weight="400" fill="#1f2328">$0.183</text>
  <rect x="28.0" y="172.0" width="8" height="8" fill="#1a7f37"/>
  <text x="40.0" y="179.0" font-size="9" font-weight="400" fill="#59636e">cache write 57% vs 47%</text>
  <text x="158.8" y="179.0" font-size="9" font-weight="400" fill="#59636e"> · </text>
  <rect x="175.0" y="172.0" width="8" height="8" fill="#1b7c83"/>
  <text x="187.0" y="179.0" font-size="9" font-weight="400" fill="#59636e">cache read 27% vs 33%</text>
  <text x="300.4" y="179.0" font-size="9" font-weight="400" fill="#59636e"> · </text>
  <rect x="316.6" y="172.0" width="8" height="8" fill="#bf3989"/>
  <text x="328.6" y="179.0" font-size="9" font-weight="400" fill="#59636e">output 16% vs 20%</text>
  <rect x="28.0" y="185.0" width="8" height="8" fill="#8250df"/>
  <text x="40.0" y="192.0" font-size="9" font-weight="400" fill="#59636e">uncached input &lt;1% vs &lt;1%</text>
  <text x="456.0" y="127.0" font-size="13" font-weight="500" fill="#1f2328">Codex CLI · gpt-5.6-terra</text>
  <text x="456.0" y="143.0" font-size="11" font-weight="400" fill="#0969da">with kmp-test</text>
  <rect x="548.0" y="132.0" width="78.8" height="14.0" rx="1" fill="#1b7c83"/>
  <rect x="626.8" y="132.0" width="65.7" height="14.0" rx="1" fill="#bf3989"/>
  <rect x="692.4" y="132.0" width="97.6" height="14.0" rx="1" fill="#8250df"/>
  <text x="798.0" y="143.0" font-size="11" font-weight="400" fill="#1f2328">$0.108</text>
  <text x="456.0" y="161.0" font-size="11" font-weight="400" fill="#bc4c00">without</text>
  <rect x="548.0" y="150.0" width="88.8" height="14.0" rx="1" fill="#1b7c83"/>
  <rect x="636.8" y="150.0" width="55.9" height="14.0" rx="1" fill="#bf3989"/>
  <rect x="692.8" y="150.0" width="97.2" height="14.0" rx="1" fill="#8250df"/>
  <text x="798.0" y="161.0" font-size="11" font-weight="400" fill="#1f2328">$0.212</text>
  <rect x="456.0" y="172.0" width="8" height="8" fill="#1b7c83"/>
  <text x="468.0" y="179.0" font-size="9" font-weight="400" fill="#59636e">cache read 33% vs 37%</text>
  <text x="581.4" y="179.0" font-size="9" font-weight="400" fill="#59636e"> · </text>
  <rect x="597.6" y="172.0" width="8" height="8" fill="#bf3989"/>
  <text x="609.6" y="179.0" font-size="9" font-weight="400" fill="#59636e">output 27% vs 23%</text>
  <rect x="456.0" y="185.0" width="8" height="8" fill="#8250df"/>
  <text x="468.0" y="192.0" font-size="9" font-weight="400" fill="#59636e">uncached input 40% vs 40%</text>
</svg>
