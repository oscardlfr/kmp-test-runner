<svg viewBox="0 0 880 222" width="880" height="222" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title>Where a session's API cost goes</title>
  <desc>Each bar is as long as its group's median session cost, on one scale for the whole figure, and its colored segments split that cost by each component's share. Color legend. With kmp-test (#0969da), without (#bc4c00). Cost component: cache write (#1a7f37), cache read (#1b7c83), output (#bf3989), uncached input (#8250df).</desc>
  <rect x="1" y="1" width="878" height="220" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="28.0" y="48.0" font-size="20" font-weight="600" fill="#1f2328">Where a session's API cost goes</text>
  <text x="28.0" y="75.0" font-size="13" font-weight="400" fill="#59636e">Bar length is the median session cost, on one scale for both agents; the colors split it by each group's</text>
  <text x="28.0" y="92.0" font-size="13" font-weight="400" fill="#59636e">share of its total cost (percentages below). Blue: with kmp-test; orange: without.</text>
  <text x="28.0" y="127.0" font-size="13" font-weight="500" fill="#1f2328">Claude Code · claude-sonnet-5</text>
  <text x="28.0" y="143.0" font-size="11" font-weight="400" fill="#0969da">with kmp-test</text>
  <rect x="120.0" y="132.0" width="100.1" height="14.0" rx="1" fill="#1a7f37"/>
  <rect x="220.1" y="132.0" width="39.3" height="14.0" rx="1" fill="#1b7c83"/>
  <rect x="259.4" y="132.0" width="55.4" height="14.0" rx="1" fill="#bf3989"/>
  <rect x="314.8" y="132.0" width="0.0" height="14.0" rx="1" fill="#8250df"/>
  <text x="322.8" y="143.0" font-size="11" font-weight="400" fill="#1f2328">$0.131</text>
  <text x="28.0" y="161.0" font-size="11" font-weight="400" fill="#bc4c00">without</text>
  <rect x="120.0" y="150.0" width="112.1" height="14.0" rx="1" fill="#1a7f37"/>
  <rect x="232.1" y="150.0" width="51.4" height="14.0" rx="1" fill="#1b7c83"/>
  <rect x="283.5" y="150.0" width="52.3" height="14.0" rx="1" fill="#bf3989"/>
  <rect x="335.8" y="150.0" width="0.1" height="14.0" rx="1" fill="#8250df"/>
  <text x="343.8" y="161.0" font-size="11" font-weight="400" fill="#1f2328">$0.146</text>
  <rect x="28.0" y="172.0" width="8" height="8" fill="#1a7f37"/>
  <text x="40.0" y="179.0" font-size="9" font-weight="400" fill="#59636e">cache write 51% vs 52%</text>
  <text x="158.8" y="179.0" font-size="9" font-weight="400" fill="#59636e"> · </text>
  <rect x="175.0" y="172.0" width="8" height="8" fill="#1b7c83"/>
  <text x="187.0" y="179.0" font-size="9" font-weight="400" fill="#59636e">cache read 20% vs 24%</text>
  <text x="300.4" y="179.0" font-size="9" font-weight="400" fill="#59636e"> · </text>
  <rect x="316.6" y="172.0" width="8" height="8" fill="#bf3989"/>
  <text x="328.6" y="179.0" font-size="9" font-weight="400" fill="#59636e">output 28% vs 24%</text>
  <rect x="28.0" y="185.0" width="8" height="8" fill="#8250df"/>
  <text x="40.0" y="192.0" font-size="9" font-weight="400" fill="#59636e">uncached input &lt;1% vs &lt;1%</text>
  <text x="456.0" y="127.0" font-size="13" font-weight="500" fill="#1f2328">Codex CLI · gpt-5.6-terra</text>
  <text x="456.0" y="143.0" font-size="11" font-weight="400" fill="#0969da">with kmp-test</text>
  <rect x="548.0" y="132.0" width="55.6" height="14.0" rx="1" fill="#1b7c83"/>
  <rect x="603.6" y="132.0" width="41.2" height="14.0" rx="1" fill="#bf3989"/>
  <rect x="644.7" y="132.0" width="111.9" height="14.0" rx="1" fill="#8250df"/>
  <text x="764.6" y="143.0" font-size="11" font-weight="400" fill="#1f2328">$0.141</text>
  <text x="456.0" y="161.0" font-size="11" font-weight="400" fill="#bc4c00">without</text>
  <rect x="548.0" y="150.0" width="64.5" height="14.0" rx="1" fill="#1b7c83"/>
  <rect x="612.5" y="150.0" width="49.1" height="14.0" rx="1" fill="#bf3989"/>
  <rect x="661.6" y="150.0" width="128.4" height="14.0" rx="1" fill="#8250df"/>
  <text x="798.0" y="161.0" font-size="11" font-weight="400" fill="#1f2328">$0.163</text>
  <rect x="456.0" y="172.0" width="8" height="8" fill="#1b7c83"/>
  <text x="468.0" y="179.0" font-size="9" font-weight="400" fill="#59636e">cache read 27% vs 27%</text>
  <text x="581.4" y="179.0" font-size="9" font-weight="400" fill="#59636e"> · </text>
  <rect x="597.6" y="172.0" width="8" height="8" fill="#bf3989"/>
  <text x="609.6" y="179.0" font-size="9" font-weight="400" fill="#59636e">output 20% vs 20%</text>
  <rect x="456.0" y="185.0" width="8" height="8" fill="#8250df"/>
  <text x="468.0" y="192.0" font-size="9" font-weight="400" fill="#59636e">uncached input 54% vs 53%</text>
</svg>
