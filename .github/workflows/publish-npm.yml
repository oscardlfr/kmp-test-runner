name: Publish to npm
on:
  push:
    branches: [main]
    paths:
      # Only fire on changes that could plausibly affect the published npm shape.
      # Avoids cycling on docs-only commits.
      - 'package.json'
      - 'package-lock.json'
      - 'bin/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/publish-npm.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed if we end up tagging from this workflow
      id-token: write       # required for npm publish --provenance (Trusted Publisher OIDC)
      checks: read          # release-gate reads check-runs API
      statuses: read        # release-gate reads commit statuses API
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0    # need full history to query existing tags

      # npm's Trusted Publishing (OIDC, --provenance) requires npm >= 11.5.1 and
      # Node >= 22.14.0 (docs.npmjs.com/trusted-publishers). An older bundled npm
      # still signs a provenance statement with the GitHub OIDC token -- a
      # separate, older feature -- but predates Trusted Publishing itself, so
      # the registry PUT goes out with no valid auth and fails with a bare 404.
      # Node 24.18.0 (same pin as ci.yml) bundles npm 11.16.0, clearing both
      # floors with no separate npm install step.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'

      # Guard 1: only publish when GITHUB_SHA is the tip of origin/main.
      # Blocks manual workflow_dispatch from non-main branches.
      - name: Guard — only publish from tip of main
        run: |
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "::error::GITHUB_SHA ($GITHUB_SHA) is not the tip of origin/main ($MAIN_SHA). Refusing to publish."
            exit 1
          fi

      # Guard 2: verify all required CI checks are green on this SHA.
      # Manual workflow_dispatch cannot bypass this — same check as the auto path.
      - name: Guard — required CI checks green on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/release-gate.mjs poll-checks "$GITHUB_SHA" .github/required-checks.json \
            --repo "$GITHUB_REPOSITORY" --timeout-minutes 60

      - name: Read version from package.json
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if version already on npm (idempotency)
        id: check
        run: |
          if npm view "kmp-test-runner@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version ${{ steps.ver.outputs.version }} already published — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${{ steps.ver.outputs.version }} not yet on npm — will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public
