name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
# Cancel in-progress CI for the same PR when a new commit is pushed.
# Push-to-develop/main runs are isolated (keyed by run_id) and are never
# cancelled — each push run completes independently.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Fast pre-check: decides whether the heavy CI matrix needs to run.
  # The `report-skipped-as-success` sentinel below keeps required heavy
  # contexts green when this job decides they are not needed.
  #
  # Docs-only (heavy=false, agentic_eval=false when ALL changes fall here):
  #   *.md, .smoke/**, .gitignore
  #
  # Agentic-eval-only (heavy=false, agentic_eval=true when ALL non-doc changes
  # fall here):
  #   tools/agentic-eval/**, tests/vitest/agentic-eval-*.test.js,
  #   tests/fixtures/fake-claude*/**, docs/audits/**
  #
  # Always heavy=true (triggers the full matrix):
  #   PRs to main, push events on main, source code outside agentic-eval,
  #   tests outside agentic-eval, scripts/, gradle-plugin/, package.json,
  #   .github/workflows/**, AND line-ending rule changes.
  #   .gitattributes is the source of truth for check-line-endings.mjs —
  #   a change to LF rules must run build (checker + workflow-static tests).
  #
  # secrets-scan stays unconditional (security is non-negotiable).
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      agentic_eval: ${{ steps.filter.outputs.agentic_eval }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${PR_IS_DRAFT}" = "true" ]; then
            echo "Draft PR -- hosted heavy matrix deferred until ready_for_review"
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "agentic_eval=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if { [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${PR_BASE_REF}" = "main" ]; } || [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "Release/main validation -- heavy=true"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "agentic_eval=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PR_BASE_SHA" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BEFORE"
          else
            echo "Cannot determine diff base — defaulting to heavy=true (safe)"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "agentic_eval=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          if [ -z "$CHANGED" ]; then
            echo "Empty diff — defaulting to heavy=true (safe)"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "agentic_eval=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOC_SKIPPABLE_RE='^(.+\.md|\.smoke/.*|\.gitignore)$'
          AGENTIC_EVAL_RE='^(tools/agentic-eval/.*|tests/vitest/agentic-eval-[^/]*\.test\.js|tests/fixtures/fake-claude[^/]*/.*|docs/audits/.*)$'

          # grep returns 1 when no lines match. Capture exits explicitly to
          # avoid bash -e killing the step on that legitimate outcome.
          set +e
          NON_DOC=$(printf '%s\n' "$CHANGED" | grep -vE "$DOC_SKIPPABLE_RE")
          NON_DOC_EXIT=$?
          NON_AGENTIC_OR_DOC=$(printf '%s\n' "$CHANGED" | grep -vE "($DOC_SKIPPABLE_RE|$AGENTIC_EVAL_RE)")
          NON_AGENTIC_OR_DOC_EXIT=$?
          AGENTIC_MATCHES=$(printf '%s\n' "$CHANGED" | grep -E "$AGENTIC_EVAL_RE")
          AGENTIC_MATCH_EXIT=$?
          set -e
          if [ "$NON_DOC_EXIT" -eq 1 ]; then
            CHANGED_COUNT=$(printf '%s\n' "$CHANGED" | wc -l | tr -d ' ')
            echo "All ${CHANGED_COUNT} changed files are docs-only skip-eligible — heavy=false, agentic_eval=false"
            printf '%s\n' "$CHANGED" | sed 's/^/  /'
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "agentic_eval=false" >> "$GITHUB_OUTPUT"
          elif [ "$NON_AGENTIC_OR_DOC_EXIT" -eq 1 ] && [ "$AGENTIC_MATCH_EXIT" -eq 0 ]; then
            CHANGED_COUNT=$(printf '%s\n' "$CHANGED" | wc -l | tr -d ' ')
            echo "All ${CHANGED_COUNT} changed files are agentic-eval/docs scoped — heavy=false, agentic_eval=true"
            echo "Agentic-eval files:"
            printf '%s\n' "$AGENTIC_MATCHES" | sed 's/^/  /'
            echo "heavy=false" >> "$GITHUB_OUTPUT"
            echo "agentic_eval=true" >> "$GITHUB_OUTPUT"
          elif [ "$NON_AGENTIC_OR_DOC_EXIT" -eq 0 ]; then
            echo "Heavy-impact file changes detected — heavy=true"
            echo "Heavy-impact files:"
            printf '%s\n' "$NON_AGENTIC_OR_DOC" | sed 's/^/  /'
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "agentic_eval=false" >> "$GITHUB_OUTPUT"
          else
            echo "Diff classification failed — defaulting to heavy=true (safe)"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "agentic_eval=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Draft privacy audit (tools/decouple-audit.mjs)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: node tools/decouple-audit.mjs

  agentic-eval:
    needs: decide
    if: needs.decide.outputs.agentic_eval == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check line endings (tools/check-line-endings.mjs)
        run: node tools/check-line-endings.mjs
      - name: Check fixture executable bits (tools/check-executable-fixtures.mjs)
        run: node tools/check-executable-fixtures.mjs
      - name: Parse Evidence 1 PowerShell launch/readiness scripts
        shell: pwsh
        run: |
          $errors = @()
          foreach ($file in Get-ChildItem -LiteralPath docs/audits -Filter 'evidence1-*.ps1') {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $messages = ($parseErrors | ForEach-Object { $_.Message }) -join '; '
              $errors += "${file}: $messages"
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Agentic-eval Vitest subset
        shell: bash
        run: |
          mapfile -t files < <(find tests/vitest -maxdepth 1 -name 'agentic-eval-*.test.js' | sort)
          npx vitest run "${files[@]}"

  build:
    needs: decide
    if: needs.decide.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows leg runs Pester, a Windows-only Gradle TestKit smoke,
    # coverage Vitest, and the Node 18 compatibility smoke. Keep a real cap,
    # but give the full matrix enough room to finish instead of cancelling a
    # passing Node 18 suite at the previous 20 minute job limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check line endings (tools/check-line-endings.mjs)
        run: node tools/check-line-endings.mjs
      - name: Check fixture executable bits (tools/check-executable-fixtures.mjs)
        run: node tools/check-executable-fixtures.mjs
      # Blocking security gate scopes to PRODUCTION dependencies — what
      # consumers actually install. This package ships ZERO runtime deps (all
      # devDependencies are the vitest/vite/esbuild test toolchain, never
      # published), so this protects consumers from any vulnerable shipped code
      # and future-proofs the day a runtime dep is added — without failing
      # every PR on live-advisory churn in the test runner.
      - name: npm audit (production deps — blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false
      # Full audit incl. devDependencies stays VISIBLE for maintainers but is
      # non-blocking: dev-toolchain advisories are addressed via dependency
      # upgrades on their own cadence, not by blocking unrelated PRs.
      - name: npm audit (dev toolchain — informational)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck --severity=warning --external-sources --exclude=SC2034,SC2053,SC2069 scripts/sh/*.sh scripts/sh/lib/*.sh scripts/install.sh scripts/uninstall.sh .skills/kmp-test-runner/scripts/*.sh
      - name: bats
        if: matrix.os == 'ubuntu-latest'
        run: npx bats tests/bats/ tests/installer/ tests/skill-scripts/
      - name: Pester
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Invoke-Pester -Path tests/pester/,tests/installer/,tests/skill-scripts/ -CI
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        if: matrix.os == 'windows-latest'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Gradle plugin Windows TaskAction smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: cd gradle-plugin && .\gradlew.bat test --tests "*.TaskActionTest"
      - name: vitest
        run: npx vitest run --coverage
      # Node 18 smoke: validate the declared engines.node >=18 floor.
      # Node 18 is EOL (April 2025) — this validates legacy compatibility only.
      # A future PR should raise engines.node to a supported LTS (22+ or 24).
      # Runs on both ubuntu and windows: Windows-specific spawnSync dispatch
      # paths (cmd.exe routing) exercise code paths sensitive to Node version.
      # npm ci runs fresh under Node 18 — node_modules from Node 24 are not reused.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '18.20.8'
      - name: Node 18 smoke — npm ci under Node 18
        run: npm ci
      - name: Node 18 smoke — vitest run on declared-minimum Node (engines.node >=18)
        timeout-minutes: 8
        run: npx vitest run
  secrets-scan:
    # Always runs — security checks are non-negotiable, even on docs-only PRs.
    # Also gates the release version-pin invariant: tools/sync-versions.js --check
    # exits non-zero if package.json version drifts from gradle-plugin / README / CLAUDE.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Verify version pins are in sync (tools/sync-versions.js --check)
        run: node tools/sync-versions.js --check
      - name: Validate required-checks manifest (schema)
        run: node tools/validate-required-checks.mjs --schema-only
      - name: Mint required-checks-drift (GitHub App) token
        id: required-checks-app-token
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ secrets.REQUIRED_CHECKS_APP_ID }}
          private-key: ${{ secrets.REQUIRED_CHECKS_APP_PRIVATE_KEY }}
      - name: Validate required-checks manifest vs branch protection (drift)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ steps.required-checks-app-token.outputs.token }}
        run: node tools/validate-required-checks.mjs --check-drift
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55  # v3.95.9
        with:
          extra_args: --only-verified
  decouple-audit:
    # Always enforced: draft PRs run this audit inside `decide` to reuse its
    # runner; ready PRs and branch pushes use this dedicated required job.
    # Fails on any committed text matching the maintainer's PRIVATE_PATTERNS
    # registry (private project / module names, home-directory paths, etc.).
    # See `tools/decouple-audit.mjs` and CLAUDE.md "Decouple from L0".
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Decouple-from-L0 audit (tools/decouple-audit.mjs)
        run: node tools/decouple-audit.mjs
  bundle-size:
    # Runs on ready PRs and branch pushes. Draft pushes defer it to the final
    # local gate. Guards against accidental tarball growth from refactors
    # that pull in heavy transitive deps or unintended file inclusions.
    # Fails when the would-be-published tarball or unpacked size exceeds
    # the named-constant budgets in tools/check-bundle-size.mjs.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Bundle-size budget gate (tools/check-bundle-size.mjs)
        run: node tools/check-bundle-size.mjs
  skills-validate:
    # Runs on ready PRs and branch pushes. Draft pushes defer it to the final
    # local gate. Content quality gate for the agentskills.io-conformant
    # bundled skill at .skills/kmp-test-runner/. Catches frontmatter typos,
    # naming-rule violations, and reference-chain breakage. Cheap (~5s)
    # so no decide-gating.
    # See `agentskills.io/specification` and `.skills/kmp-test-runner/SKILL.md`.
    #
    # Job also validates the Claude Code plugin manifest at
    # .claude-plugin/plugin.json that wraps the skill (PR 5 of v0.10 #4
    # sub-train). Same job, same required check — no new branch-protection
    # update needed. See `tools/validate-plugin.mjs` for the rule list.
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Validate agent skill (npx skills-ref@0.1.5)
        run: npx -y skills-ref@0.1.5 validate .skills/kmp-test-runner/
      - name: Validate Claude Code plugin manifest (tools/validate-plugin.mjs)
        run: node tools/validate-plugin.mjs
  installer-e2e:
    needs: [decide, build]
    if: needs.decide.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '24.18.0'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Build local artifact (Linux)
        if: matrix.os != 'windows-latest'
        run: |
          ARTIFACT_VER="$(node -p "require('./package.json').version")"
          bash scripts/build-artifact.sh "$ARTIFACT_VER" /tmp/kmp-e2e-artifacts
          echo "LOCAL_ARCHIVE=/tmp/kmp-e2e-artifacts/kmp-test-runner-${ARTIFACT_VER}-linux.tar.gz" >> "$GITHUB_ENV"
          echo "ARTIFACT_VER=${ARTIFACT_VER}" >> "$GITHUB_ENV"
      - name: Install npm deps (Linux — bats via local node_modules)
        if: matrix.os != 'windows-latest'
        run: npm ci
      - name: Run E2E bats tests (Linux)
        if: matrix.os != 'windows-latest'
        # --filter "E2E" runs the install.sh archive-roundtrip tests only.
        # The non-E2E install.bats tests are static-grep / mocked-uname checks
        # already covered by the ubuntu bats job; no value re-running here.
        run: npx bats tests/installer/install.bats --filter "E2E"
      - name: Run E2E Pester tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Invoke-Pester -Path tests/installer/Install.Tests.ps1 -CI -TagFilter 'E2E'
  gradle-plugin-test:
    needs: decide
    if: needs.decide.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Test Gradle plugin
        run: cd gradle-plugin && ./gradlew test

  # 2026-05-05 — CI cost discipline + branch protection bridge.
  # PR4 introduced the `decide` job to skip heavy jobs on docs-only PRs
  # (saves CI minutes — see `feedback_ci_cost_discipline.md`). But branch
  # protection on develop+main requires the heavy contexts (build × ubuntu/
  # win, installer-e2e × ubuntu/win, gradle-plugin-test) to report `success`
  # — and skipped jobs report `skipped`, not `success`. Net result before
  # this sentinel: docs-only PRs cannot merge because branch protection
  # rejects skipped contexts (PR #132 hit this 2026-05-05).
  #
  # This sentinel runs ONLY when heavy=false and posts a `success`
  # commit-status to each required heavy context, satisfying branch
  # protection without spinning up the heavy runners. When heavy=true the
  # sentinel is a no-op — the real heavy jobs report success themselves.
  #
  # Required heavy contexts mirror branch-protection's required_status_checks
  # list (verified 2026-05-05 via `gh api repos/.../branches/develop/protection`).
  # `secrets-scan` and `Commit Lint` are NOT in this list — they always run
  # regardless of heavy state, so branch protection sees them green directly.
  # All macOS jobs (build-macos, installer-e2e-macos, bats-macos,
  # gradle-plugin-test-ios) run only in macos-validation.yml
  # (workflow_dispatch). None are required checks.
  report-skipped-as-success:
    needs: decide
    if: needs.decide.outputs.heavy != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Post success status for skipped required heavy checks
        run: |
          # PR events: report against the head SHA (what branch protection
          # checks). Push events: report against github.sha (the new commit).
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          for CTX in \
            "build (ubuntu-latest)" \
            "build (windows-latest)" \
            "gradle-plugin-test" \
            "installer-e2e (ubuntu-latest)" \
            "installer-e2e (windows-latest)"; do
            gh api "repos/${{ github.repository }}/statuses/$SHA" \
              -f state=success \
              -f context="$CTX" \
              -f description="Skipped via CI cost discipline (heavy=false)"
            echo "Posted success status for: $CTX"
          done
