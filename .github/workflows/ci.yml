name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  # Fast pre-check: decides whether the heavy CI matrix needs to run.
  # When ALL diffed files are docs (any *.md), local smoke captures,
  # or git config (.gitignore / .gitattributes), the downstream heavy
  # jobs short-circuit. GitHub treats `skipped` as `success` for
  # required-check gating (since 2022), so branch protection still
  # passes without burning macOS minutes.
  #
  # Source code, tests/, scripts/, tools/, gradle-plugin/, package.json,
  # and .github/workflows/** ALWAYS trigger the full matrix — anything
  # the test suite or installer could regress on.
  #
  # secrets-scan stays unconditional (security is non-negotiable).
  decide:
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$PUSH_BEFORE"
          else
            echo "Cannot determine diff base — defaulting to heavy=true (safe)"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          if [ -z "$CHANGED" ]; then
            echo "Empty diff — defaulting to heavy=true (safe)"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # grep returns 1 when no lines match (= all changes are skippable).
          # Capture exit explicitly to avoid bash -e killing the step on that
          # legitimate "no matches" outcome.
          set +e
          NON_SKIPPABLE=$(printf '%s\n' "$CHANGED" | grep -vE '^(.+\.md|\.smoke/.*|\.gitignore|\.gitattributes)$')
          GREP_EXIT=$?
          set -e
          if [ "$GREP_EXIT" -eq 0 ]; then
            echo "Non-skippable file changes detected — heavy=true"
            echo "Non-skippable files:"
            printf '  %s\n' $NON_SKIPPABLE
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          elif [ "$GREP_EXIT" -eq 1 ]; then
            echo "All ${#CHANGED} changed files are skip-eligible — heavy=false"
            echo "Skipped files:"
            printf '  %s\n' $CHANGED
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Grep failed with exit $GREP_EXIT — defaulting to heavy=true (safe)"
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: decide
    if: needs.decide.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Blocking security gate scopes to PRODUCTION dependencies — what
      # consumers actually install. This package ships ZERO runtime deps (all
      # devDependencies are the vitest/vite/esbuild test toolchain, never
      # published), so this protects consumers from any vulnerable shipped code
      # and future-proofs the day a runtime dep is added — without failing
      # every PR on live-advisory churn in the test runner.
      - name: npm audit (production deps — blocking)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false
      # Full audit incl. devDependencies stays VISIBLE for maintainers but is
      # non-blocking: dev-toolchain advisories are addressed via dependency
      # upgrades on their own cadence, not by blocking unrelated PRs.
      - name: npm audit (dev toolchain — informational)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck --severity=warning --external-sources --exclude=SC2034,SC2053,SC2069 scripts/sh/*.sh scripts/sh/lib/*.sh scripts/install.sh scripts/uninstall.sh
      - name: bats
        if: matrix.os == 'ubuntu-latest'
        run: npx bats tests/bats/ tests/installer/ tests/skill-scripts/
      - name: Pester
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Invoke-Pester -Path tests/pester/,tests/installer/,tests/skill-scripts/ -CI
      - name: vitest
        run: npx vitest run --coverage
  secrets-scan:
    # Always runs — security checks are non-negotiable, even on docs-only PRs.
    # Also gates the release version-pin invariant: tools/sync-versions.js --check
    # exits non-zero if package.json version drifts from gradle-plugin / README / CLAUDE.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify version pins are in sync (tools/sync-versions.js --check)
        run: node tools/sync-versions.js --check
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
  decouple-audit:
    # Always runs — privacy gate is non-negotiable, even on docs-only PRs.
    # Fails on any committed text matching the maintainer's PRIVATE_PATTERNS
    # registry (private project / module names, home-directory paths, etc.).
    # See `tools/decouple-audit.mjs` and CLAUDE.md "Decouple from L0".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Decouple-from-L0 audit (tools/decouple-audit.mjs)
        run: node tools/decouple-audit.mjs
  bundle-size:
    # Always runs — guards against accidental tarball growth from refactors
    # that pull in heavy transitive deps or unintended file inclusions.
    # Fails when the would-be-published tarball or unpacked size exceeds
    # the named-constant budgets in tools/check-bundle-size.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle-size budget gate (tools/check-bundle-size.mjs)
        run: node tools/check-bundle-size.mjs
  skills-validate:
    # Always runs — content quality gate for the agentskills.io-conformant
    # bundled skill at .skills/kmp-test-runner/. Catches frontmatter typos,
    # naming-rule violations, and reference-chain breakage. Cheap (~5s)
    # so no decide-gating.
    # See `agentskills.io/specification` and `.skills/kmp-test-runner/SKILL.md`.
    #
    # Job also validates the Claude Code plugin manifest at
    # .claude-plugin/plugin.json that wraps the skill (PR 5 of v0.10 #4
    # sub-train). Same job, same required check — no new branch-protection
    # update needed. See `tools/validate-plugin.mjs` for the rule list.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate agent skill (npx skills-ref validate)
        run: npx -y skills-ref validate .skills/kmp-test-runner/
      - name: Validate Claude Code plugin manifest (tools/validate-plugin.mjs)
        run: node tools/validate-plugin.mjs
  installer-e2e:
    needs: [decide, build]
    if: needs.decide.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build local artifact (Linux/macOS — both reuse linux.tar.gz)
        if: matrix.os != 'windows-latest'
        run: |
          ARTIFACT_VER="$(node -p "require('./package.json').version")"
          bash scripts/build-artifact.sh "$ARTIFACT_VER" /tmp/kmp-e2e-artifacts
          echo "LOCAL_ARCHIVE=/tmp/kmp-e2e-artifacts/kmp-test-runner-${ARTIFACT_VER}-linux.tar.gz" >> "$GITHUB_ENV"
          echo "ARTIFACT_VER=${ARTIFACT_VER}" >> "$GITHUB_ENV"
      - name: Install npm deps (Linux/macOS — bats via local node_modules)
        if: matrix.os != 'windows-latest'
        run: npm ci
      - name: Run E2E bats tests (Linux/macOS)
        if: matrix.os != 'windows-latest'
        # --filter "E2E" runs the install.sh archive-roundtrip tests only.
        # The non-E2E install.bats tests are static-grep / mocked-uname checks
        # already covered by the ubuntu bats job; no value re-running here.
        run: npx bats tests/installer/install.bats --filter "E2E"
      - name: Run E2E Pester tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Invoke-Pester -Path tests/installer/Install.Tests.ps1 -CI -TagFilter 'E2E'
  gradle-plugin-test:
    needs: decide
    if: needs.decide.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Test Gradle plugin
        run: cd gradle-plugin && ./gradlew test
  # v0.7.0 Phase 3 — verify the gradle plugin builds + TestKit suite passes
  # on macOS. Catches mac-specific build/test regressions in the plugin
  # (BSD vs GNU shell tooling, JDK locator differences, etc.) before they
  # reach iOS users. This is informational by default; promote to required
  # in branch protection when the v0.7 line stabilises.
  gradle-plugin-test-ios:
    needs: decide
    if: needs.decide.outputs.heavy == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Test Gradle plugin (macOS)
        run: cd gradle-plugin && ./gradlew test
  # v0.7.x WS-2 — bats parity on macOS. macOS ships /bin/bash 3.2.57 (Apple
  # froze it for licensing). Bash 3.2 lacks `declare -A` and is strict about
  # `"${arr[@]}"` over empty arrays under set -u. The ubuntu-only bats job
  # (line 26-28 above) cannot catch these regressions because Linux runners
  # use bash 5.x. This job mirrors the ubuntu invocation against the system
  # bash on macos-latest, full parity (tests/bats/ + tests/installer/).
  #
  # 2026-05-03 — orphan-adb hang root-caused and fixed (v0.8.0 BACKLOG #6 + #9):
  # `kmp-test doctor`'s adb probe (lib/cli.js#runDoctorChecks) was forking an
  # adb child that inherited Node's pipe FDs, blocking bats from reaching pipe
  # EOF on suite exit (first-run evidence: 227 tests passed in ~3 min, then
  # 8-min hang, then runner-cancel + "Terminate orphan process: pid (...) (adb)").
  # The actual leak source was tests/bats/test-doctor.bats + test-concurrency.bats
  # (the only files invoking `node $CLI doctor`); install.bats was incorrectly
  # blamed in the original investigation. Fixed by KMP_TEST_SKIP_ADB=1 opt-out
  # exported from those two setup_file hooks. tests/installer/ is now back in
  # scope here.
  #
  # Informational by default; promote to required in branch protection
  # alongside gradle-plugin-test-ios when the v0.7 line stabilises.
  bats-macos:
    needs: decide
    if: needs.decide.outputs.heavy == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: bats (macOS — Bash 3.2 regression coverage)
        run: npx bats --timing tests/bats/ tests/installer/ tests/skill-scripts/

  # 2026-05-05 — CI cost discipline + branch protection bridge.
  # PR4 introduced the `decide` job to skip heavy jobs on docs-only PRs
  # (saves CI minutes — see `feedback_ci_cost_discipline.md`). But branch
  # protection on develop+main requires the heavy contexts (build × ubuntu/
  # win, installer-e2e × ubuntu/win, gradle-plugin-test) to report `success`
  # — and skipped jobs report `skipped`, not `success`. Net result before
  # this sentinel: docs-only PRs cannot merge because branch protection
  # rejects skipped contexts (PR #132 hit this 2026-05-05).
  #
  # This sentinel runs ONLY when heavy=false and posts a `success`
  # commit-status to each required heavy context, satisfying branch
  # protection without spinning up the heavy runners. When heavy=true the
  # sentinel is a no-op — the real heavy jobs report success themselves.
  #
  # Required heavy contexts mirror branch-protection's required_status_checks
  # list (verified 2026-05-05 via `gh api repos/.../branches/develop/protection`).
  # `secrets-scan` and `Commit Lint` are NOT in this list — they always run
  # regardless of heavy state, so branch protection sees them green directly.
  # Informational-only contexts (build (macos-latest), installer-e2e
  # (macos-latest), bats-macos, gradle-plugin-test-ios) are also excluded —
  # they're not required, so faking them would be misleading.
  report-skipped-as-success:
    needs: decide
    if: needs.decide.outputs.heavy != 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Post success status for skipped required heavy checks
        run: |
          # PR events: report against the head SHA (what branch protection
          # checks). Push events: report against github.sha (the new commit).
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          for CTX in \
            "build (ubuntu-latest)" \
            "build (windows-latest)" \
            "gradle-plugin-test" \
            "installer-e2e (ubuntu-latest)" \
            "installer-e2e (windows-latest)"; do
            gh api "repos/${{ github.repository }}/statuses/$SHA" \
              -f state=success \
              -f context="$CTX" \
              -f description="Skipped via CI cost discipline (heavy=false)"
            echo "Posted success status for: $CTX"
          done
