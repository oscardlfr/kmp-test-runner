name: Publish Gradle Plugin

on:
  push:
    branches: [main]
    paths:
      # Only fire on changes that could plausibly affect the published artefact.
      - 'gradle-plugin/**'
      - '.github/workflows/publish-gradle.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      checks: read          # release-gate reads check-runs API
      statuses: read        # release-gate reads commit statuses API
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      # Node is required to run tools/release-gate.mjs (this job has no setup-node by default).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      # Guard 1: only publish when GITHUB_SHA is the tip of origin/main.
      # Blocks manual workflow_dispatch from non-main branches.
      - name: Guard — only publish from tip of main
        run: |
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "::error::GITHUB_SHA ($GITHUB_SHA) is not the tip of origin/main ($MAIN_SHA). Refusing to publish."
            exit 1
          fi

      # Guard 2: verify all required CI checks are green on this SHA.
      # Manual workflow_dispatch cannot bypass this — same check as the auto path.
      - name: Guard — required CI checks green on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/release-gate.mjs poll-checks "$GITHUB_SHA" .github/required-checks.json \
            --repo "$GITHUB_REPOSITORY" --timeout-minutes 10

      - name: Read gradle-plugin version
        id: ver
        run: |
          version="$(grep -E '^version\s*=' gradle-plugin/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected gradle-plugin version: $version"

      # Idempotent publish: GitHub Packages (Maven) rejects re-publishing an existing
      # version with HTTP 409. That is a benign no-op (the artefact is already there),
      # so we tolerate exactly that case and fail loudly on anything else. This keeps
      # re-runs / re-pushes at an already-released version green without a brittle
      # pre-flight existence probe (the Packages read API needs a read:packages PAT;
      # the 409 from the publish itself is the authoritative "already published" signal).
      - name: Publish to GitHub Packages (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd gradle-plugin
          set +e
          out="$(./gradlew --no-daemon publishAllPublicationsToGitHubPackagesRepository 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then
            echo "Published gradle plugin ${VERSION} to GitHub Packages."
            exit 0
          fi
          if printf '%s' "$out" | grep -qiE "status code 409|409 from server|already exists"; then
            echo "::notice::Gradle plugin ${VERSION} already on GitHub Packages — idempotent no-op."
            exit 0
          fi
          echo "::error::Gradle publish failed (exit ${code}) for a reason other than an already-published version."
          exit "$code"
