name: Publish Gradle Plugin

on:
  push:
    branches: [main]
    paths:
      # Only fire on changes that could plausibly affect the published artefact.
      - 'gradle-plugin/**'
      - '.github/workflows/publish-gradle.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Read gradle-plugin version
        id: ver
        run: |
          version="$(grep -E '^version\s*=' gradle-plugin/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected gradle-plugin version: $version"

      # Idempotent publish: GitHub Packages (Maven) rejects re-publishing an existing
      # version with HTTP 409. That is a benign no-op (the artefact is already there),
      # so we tolerate exactly that case and fail loudly on anything else. This keeps
      # re-runs / re-pushes at an already-released version green without a brittle
      # pre-flight existence probe (the Packages read API needs a read:packages PAT;
      # the 409 from the publish itself is the authoritative "already published" signal).
      - name: Publish to GitHub Packages (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd gradle-plugin
          set +e
          out="$(./gradlew --no-daemon publishAllPublicationsToGitHubPackagesRepository 2>&1)"
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then
            echo "Published gradle plugin ${VERSION} to GitHub Packages."
            exit 0
          fi
          if printf '%s' "$out" | grep -qiE "status code 409|409 from server|already exists"; then
            echo "::notice::Gradle plugin ${VERSION} already on GitHub Packages — idempotent no-op."
            exit 0
          fi
          echo "::error::Gradle publish failed (exit ${code}) for a reason other than an already-published version."
          exit "$code"
