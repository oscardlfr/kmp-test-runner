name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.3.0)'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.3.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Pre-checkout shell format guard for workflow_dispatch / workflow_call inputs.
      # This rejects clearly malformed tags before they can be used as checkout.ref.
      # push:tags trigger uses GITHUB_REF which is already a valid git ref.
      - name: Validate tag format (pre-checkout, inputs only)
        if: inputs.tag != ''
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! echo "$INPUT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid tag format: '$INPUT_TAG'. Expected: v<major>.<minor>.<patch>"
            exit 1
          fi

      # Step 2: Checkout — safe after the pre-checkout format guard for inputs.
      # For push:tags, GITHUB_REF is the tag ref and the default checkout is correct.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # Step 3: Resolve TAG from any trigger path and validate via release-gate.
      # No "if: inputs.tag != ''" here — this runs for ALL trigger paths so that
      # push:tags with an invalid suffix (e.g. v1.2.3-bad) is also refused.
      - name: Resolve and validate tag (all trigger paths)
        id: validated-tag
        env:
          INPUTS_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUTS_TAG" ]; then
            TAG="$INPUTS_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          node tools/release-gate.mjs validate-tag "$TAG" package.json

      # Step 4: Verify the tag's target commit is reachable from origin/main.
      # This blocks feature-branch tags while allowing both new releases (tip of main)
      # and idempotent reruns of older releases (earlier main ancestors).
      - name: Verify tag commit is on main history
        run: |
          TAG="${{ steps.validated-tag.outputs.tag }}"
          git fetch origin main
          TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag ${TAG} target commit (${TAG_COMMIT}) is not reachable from origin/main. Refusing release."
            exit 1
          fi

      # Step 5: Determine version string from the already-validated TAG.
      - name: Determine version
        id: version
        run: |
          TAG="${{ steps.validated-tag.outputs.tag }}"
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build artifacts
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VER="${{ steps.version.outputs.ver }}"

          # Wrapper directory matches what install.sh (--strip-components=1) and
          # install.ps1 ("strip top-level dir") expect. v0.3.0 was missing this
          # wrapper, which broke extraction. See CHANGELOG v0.3.1.
          WRAPPER="kmp-test-runner-${VER}"
          STAGING="staging-${VER}/${WRAPPER}"
          mkdir -p "${STAGING}"

          # package.json is required at runtime — cli.js reads version from it.
          # v0.3.0 + v0.3.1 omitted this, breaking `kmp-test --version` post-install.
          cp -r bin lib scripts LICENSE CHANGELOG.md package.json "${STAGING}/"

          # Linux tarball — wrapper dir present at top level
          LINUX_ARCHIVE="kmp-test-runner-${VER}-linux.tar.gz"
          tar -czf "${LINUX_ARCHIVE}" -C "staging-${VER}" "${WRAPPER}"
          echo "linux_archive=${LINUX_ARCHIVE}" >> "$GITHUB_ENV"

          # Windows zip — wrapper dir present at top level
          WINDOWS_ARCHIVE="kmp-test-runner-${VER}-windows.zip"
          (cd "staging-${VER}" && zip -r "../${WINDOWS_ARCHIVE}" "${WRAPPER}")
          echo "windows_archive=${WINDOWS_ARCHIVE}" >> "$GITHUB_ENV"

          rm -rf "staging-${VER}"

      # Step 6: Generate SHA-256 checksums for both release artifacts.
      - name: Generate SHA-256 checksums
        run: |
          sha256sum "${{ env.linux_archive }}"   > "${{ env.linux_archive }}.sha256"
          sha256sum "${{ env.windows_archive }}" > "${{ env.windows_archive }}.sha256"
          echo "linux_sha256=${{ env.linux_archive }}.sha256"   >> "$GITHUB_ENV"
          echo "windows_sha256=${{ env.windows_archive }}.sha256" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          VER="${{ steps.version.outputs.ver }}"
          awk "/^## \[${VER}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release-notes.txt
          if [ ! -s release-notes.txt ]; then
            echo "No release notes found for version ${VER} in CHANGELOG.md" >&2
            exit 1
          fi

      # Step 7: Create GitHub Release and attach both archives plus their .sha256 files.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.txt \
            "${{ env.linux_archive }}" \
            "${{ env.linux_sha256 }}" \
            "${{ env.windows_archive }}" \
            "${{ env.windows_sha256 }}"
